# Search Console: 404 crawlet 18. maj 2026. Taksonomien flyttede fra
# /blog/categories/ til /categories/ ved Hugo-migreringen. Samme term,
# samme indhold — derfor en splat-regel frem for én URL ad gangen.
[[redirects]]
  from = "/blog/categories/*"
  to = "/categories/:splat/"
  status = 301

[[redirects]]
  from = "/blog/tags/*"
  to = "/tags/:splat/"
  status = 301

# ─────────────────────────────────────────────────────────────────────────────
# BEVIDST PARKEREDE LEGACY-404'ERE
#
# Disse gamle adresser har ingen reel, semantisk efterfølger på hjemmesiden.
# De er bevidst IKKE omdirigeret. En korrekt 404 er bedre end en forkert 301:
# en 301 til en side om et andet emne sender hverken brugeren eller Google et
# sandt signal, og Google behandler den i praksis som et soft 404.
#
# De tre første HAVDE tidligere en 301 til en adresse, der ikke findes
# (/hypnose, /ungestoette, /nervesystem). Det var en omdirigeringskæde, der
# endte i 404. Reglerne er fjernet, så adresserne nu giver en ren 404 i ét hop.
#
#   /hypnose-stammen                             stammen som emne findes ikke
#   /stoette-til-foraeldre-naar-boern-anbringes  anbringelse/pårørende findes ikke
#   /udfordringen-opstaar                        emnet kan ikke fastslås
#   /tjenester/     ydelsesoversigt — hverken /til-dig/ eller /kurser/ er entydig
#   /udtalelser/    der findes ingen udtalelsesside (og ingen udtalelser med samtykke)
#   /misbrug/       misbrug findes ikke som emne. Search Console: 6 eksponeringer,
#                   gennemsnitlig position 5,0 — det er en indholdsmulighed,
#                   ikke en omdirigering.
#
# Revurderes, hvis der senere oprettes indhold om emnet, eller hvis Search
# Console giver ny dokumentation.
# ─────────────────────────────────────────────────────────────────────────────

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

