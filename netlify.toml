# ─────────────────────────────────────────────────────────────────────────────
# AFVENTER BESLUTNING
# Disse tre gamle adresser peger på destinationer, der ikke findes (404).
# Der er ingen indholdsmæssig efterfølger på hjemmesiden, og de er derfor
# bevidst IKKE omdirigeret til den nærmeste side. Reglerne står uændret,
# indtil der er truffet beslutning om hver enkelt.
#   /hypnose-stammen                             emnet stammen findes ikke i indholdet
#   /stoette-til-foraeldre-naar-boern-anbringes  emnet anbringelse findes ikke i indholdet
#   /udfordringen-opstaar                        emnet kan ikke fastslås
# ─────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/hypnose-stammen"
  to = "/hypnose"
  status = 301

[[redirects]]
  from = "/hypnose-stammen/"
  to = "/hypnose"
  status = 301

[[redirects]]
  from = "/stoette-til-foraeldre-naar-boern-anbringes"
  to = "/ungestoette"
  status = 301

[[redirects]]
  from = "/stoette-til-foraeldre-naar-boern-anbringes/"
  to = "/ungestoette"
  status = 301

[[redirects]]
  from = "/udfordringen-opstaar"
  to = "/nervesystem"
  status = 301

[[redirects]]
  from = "/udfordringen-opstaar/"
  to = "/nervesystem"
  status = 301

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"
