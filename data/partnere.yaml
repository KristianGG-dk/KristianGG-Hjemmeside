# Samarbejdspartnere.
#
# TOM MED VILJE. Der må ikke opfindes partnere, og der må ikke vises logoer,
# vi ikke har tilladelse til at bruge.
#
# Bevidst arkitekturvalg: ingen logovæg på forsiden. En partner vises på den
# side, hvor samarbejdet betyder noget — en faglig forening på /om/, en
# kommunal samarbejdspartner på erhvervssiderne. To til fire relevante
# partnere det rigtige sted virker stærkere end tolv logoer på forsiden, og
# koster ikke hastighed.
#
# Felter:
#   navn        påkrævet
#   logo        sti under /images/partnere/ — udelades hvis vi ikke har rettigheder
#   beskrivelse én sætning om samarbejdet
#   link        valgfri
#   type        forening | leverandoer | kommune | virksomhed | fagligt-netvaerk
#   sider       hvilke sider partneren vises på

poster:
  # Officielt logo leveret af Kristian 19-09-2026. Filerne er RENE
  # nedskaleringer af originalen (LANCZOS) — intet er beskaaret, omfarvet
  # eller gentegnet. 192 px daekker 1x, 384 px daekker 2x ved 80 px visning.
  - navn: "Foreningen mod Familiebelastning"
    link: "https://familiebelastning.dk/"
    beskrivelse: "Jeg samarbejder med foreningen om familier under belastning."
    type: "forening"
    logo: "/images/partnere/foreningen-mod-familiebelastning-192.png"
    logo_webp: "/images/partnere/foreningen-mod-familiebelastning-192.webp 1x, /images/partnere/foreningen-mod-familiebelastning-384.webp 2x"
    logo_alt: "Logo for Foreningen mod Familiebelastning"
    logo_bredde: 192
    logo_hoejde: 192
    sider:
      - "/om/"

  # Officielt logo leveret af Kristian 19-09-2026. Rene nedskaleringer
  # (LANCZOS) af originalen paa 500x100 - intet beskaaret eller omfarvet.
  # ALFAKANALEN ER BEVARET: logoet er moerkeblaat paa gennemsigtig bund, og en
  # konvertering til RGB ville give sort baggrund.
  #
  # Skolen skriver selv sit navn i to ord, "Hypnose Skolen".
  - navn: "Hypnose Skolen"
    link: "https://hypnoseskolen.dk/"
    beskrivelse: "Uddannelsessted for hypnoterapi og NLP. Jeg tilbyder egenterapi til skolens studerende til reduceret pris."
    type: "fagligt-netvaerk"
    logo: "/images/partnere/hypnose-skolen-200.png"
    logo_webp: "/images/partnere/hypnose-skolen-200.webp 1x, /images/partnere/hypnose-skolen-400.webp 2x"
    logo_alt: "Logo for Hypnose Skolen"
    logo_bredde: 200
    logo_hoejde: 40
    sider:
      - "/om/"

  # Cover leveret af Kristian 22-09-2026. Rene nedskaleringer (LANCZOS) af
  # originalen paa 540x540 - intet beskaaret, omfarvet eller gentegnet.
  #
  # ANDET FILFORMAT END DE OEVRIGE TO, og det er med vilje. De andre logoer er
  # flade maerker, hvor PNG er baade lille og skarp. Dette er et fotografisk
  # podcastcover med farveforloeb: PNG ville veje 46 kB ved 192 px og 146 kB
  # ved 384 px. WebP vejer 9 og 20 kB ved samme kvalitet, og JPEG er reserven
  # for de faa browsere uden WebP.
  #
  # BESKRIVELSEN STOD FOERST SOM "Jeg medvirker i en episode". DET VAR
  # FORKERT - Kristian rettede det 22-09-2026: han medvirker ikke i en
  # episode endnu, de samarbejder om et andet projekt. Sætningen herunder
  # siger kun det, han selv har sagt. Naar projektet kan navngives, skal den
  # skrives om til noget, en laeser faktisk kan bruge.
  #
  # LINKET PEGER PAA EN EPISODE, ikke paa showets forside. Det var det link,
  # Kristian gav - men nu hvor han ikke medvirker i den, giver en showside
  # bedre mening. Afventer hans adresse.
  - navn: "Bettinas Verden"
    link: "https://open.spotify.com/episode/3P4HpDwdcWzCGxPupd5tkf"
    beskrivelse: "Podcast. Vi samarbejder om et fælles projekt."
    type: "fagligt-netvaerk"
    logo: "/images/partnere/bettinas-verden-192.jpg"
    logo_webp: "/images/partnere/bettinas-verden-192.webp 1x, /images/partnere/bettinas-verden-384.webp 2x"
    logo_alt: "Cover for podcasten Bettinas Verden"
    logo_bredde: 192
    logo_hoejde: 192
    sider:
      - "/om/"
