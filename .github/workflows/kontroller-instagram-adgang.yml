# Kontrollerer at Instagram-adgangen virker. Publicerer ALDRIG noget.
#
# Scriptet sender udelukkende GET. Der findes ingen sti gennem dette workflow
# der kan oprette en mediecontainer eller et opslag: publiceringsscripts
# kaldes ikke, og der er ingen parameter at saette forkert.
#
# Startes kun manuelt.
name: Kontroller Instagram-adgang

on:
  workflow_dispatch:

permissions: {}

jobs:
  kontroller:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: publicering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # FB_PAGE_ID, FB_APP_ID og FB_APP_SECRET bruges UDELUKKENDE til laesning:
      # at bekraefte at Instagram-kontoen haenger paa vores side, og at faa
      # granulaere scopes med i tokenrapporten. Facebook-opsaetningen aendres
      # ikke - den aflaeses.
      - name: Kontroller Instagram-adgang
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: node publicering/scripts/kontroller-instagram-adgang.mjs
