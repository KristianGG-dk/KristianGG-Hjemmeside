# Holder det faelles opgaveregister i trit med virkeligheden.
#
# Den koerer EFTER vagthunden og oversaetter dens fund til opgaver med faste
# id'er. Den opretter ingen dubletter og genaabner aldrig en lukket opgave.
#
# Privilegiedelingen fra motoren er bevaret: jobbet, der laeser GitHub og
# driften, skriver intet; jobbet, der skriver, roerer kun drift/opgaver.json.
name: Synkroniser driftsstatus

on:
  schedule:
    # Efter vagthundens to koersler (08:30 og 18:30 UTC), paa et skaevt minut.
    - cron: '47 8,18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  synkroniser:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # kun drift/
      actions: read       # for at se, OM de planlagte koersler stadig koerer
      issues: write       # kun for at skrive kvitteringen paa et overdraget issue
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Vagthunden skriver intet. Den laeser driften og afleverer sine fund.
      # continue-on-error, fordi en FEJL fra vagthunden er praecis det, der
      # skal blive til en opgave — ikke noget, der skal stoppe jobbet.
      - name: Hent vagthundens fund
        id: vagt
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node publicering/scripts/vagthund.mjs --json > /tmp/vagt.json

      # Overdragelser udefra. Issues med etiketten til-codex, til-claude eller
      # til-kristian bliver til opgaver. Issues UDEN etiket roeres ikke — det
      # eksisterende #90 og alt andet staar uroert.
      #
      # har_kvittering afgoer, om issuet allerede har faaet sit svar. Uden
      # det ville hvert issue fyldes med den samme kommentar to gange i
      # doegnet.
      - name: Hent overdragne issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" "$1"; }
          R="https://api.github.com/repos/${{ github.repository }}"
          api "$R/issues?state=all&per_page=100&labels=til-codex" > /tmp/i1.json
          api "$R/issues?state=all&per_page=100&labels=til-claude" > /tmp/i2.json
          api "$R/issues?state=all&per_page=100&labels=til-kristian" > /tmp/i3.json
          python3 - <<'PY'
          import json, os, urllib.request
          ude, set_ = [], set()
          for f in ('/tmp/i1.json', '/tmp/i2.json', '/tmp/i3.json'):
              for i in json.load(open(f)):
                  if i['number'] in set_ or 'pull_request' in i: continue
                  set_.add(i['number']); ude.append(i)
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          for i in ude:
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{i['number']}/comments?per_page=100",
                  headers={'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json'})
              try:
                  k = json.load(urllib.request.urlopen(r))
              except Exception:
                  k = []
              i['har_kvittering'] = any('kvittering: optaget i drift/opgaver.json' in (c.get('body') or '') for c in k)
          json.dump(ude, open('/tmp/issues.json', 'w'))
          print(f'{len(ude)} overdragne issue(s)')
          PY

      - name: Synkroniser opgaveregisteret
        run: |
          node publicering/scripts/synkroniser-drift.mjs \
            --vagthund /tmp/vagt.json \
            --issues /tmp/issues.json \
            --kvitteringer /tmp/kvitteringer.json \
            --skriv

      # Kvitteringen er beviset paa, at overdragelsen er MODTAGET. Uden den
      # er en opgave ikke overdraget, kun omtalt.
      - name: Skriv kvitteringerne
        if: ${{ hashFiles('/tmp/kvitteringer.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          for k in json.load(open('/tmp/kvitteringer.json')):
              data = json.dumps({'body': k['krop']}).encode()
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{k['nummer']}/comments",
                  data=data, method='POST',
                  headers={'Authorization': f'Bearer {tok}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'})
              urllib.request.urlopen(r)
              print(f"kvittering skrevet paa #{k['nummer']}")
          PY

      # Claudes indgang. Den kan laeses uden adgang til repoet, fordi repoet
      # er offentligt. Det er den eneste kanal, der med sikkerhed virker.
      - name: Skriv Claudes indgang
        run: node publicering/scripts/status.mjs --til-claude > drift/TIL-CLAUDE.md

      - name: Skriv det samlede overblik i joboversigten
        run: |
          node publicering/scripts/status.mjs --markdown --vagthund /tmp/vagt.json \
            >> "$GITHUB_STEP_SUMMARY"

      # Append-only og kollisionssikkert, som registret. Er der intet aendret,
      # committes der intet.
      - name: Gem aendringerne
        run: |
          if git diff --quiet drift/; then
            echo "Registeret sagde allerede det samme som systemet. Intet committet."
            exit 0
          fi
          git config user.name "vagthund"
          git config user.email "kontakt@kristiangg.dk"
          git add drift/
          bash publicering/scripts/commit-register.sh \
            drift/ \
            "drift: opgaveregisteret afstemt med driften" \
            "node publicering/scripts/synkroniser-drift.mjs --vagthund /tmp/vagt.json --skriv"
