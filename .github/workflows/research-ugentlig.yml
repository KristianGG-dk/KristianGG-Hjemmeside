# Researchmotoren — ugentlig indsamling, vurdering og arkivering.
#
# To job med hver sin rettighed. Det er hele sikkerhedsmodellen:
#
#   research  contents: read   henter fra internettet, kan intet skrive
#   arkiver   contents: write  ser aldrig internettet, laeser kun artefakten
#
# Det job, der behandler data fra fremmede servere, har ingen skriveret.
# Det job, der har skriveret, henter intet udefra. Et manipuleret svar fra
# en kilde kan derfor ikke naa frem til noget, der kan skrive i repoet.
#
# Mellem dem staar vagt-arkiv.mjs, som afviser enhver fundfil, der ikke er
# velformet — ukendte felter, styretegn, urimelige laengder eller en url, der
# ikke er http(s). Vagten koerer paa DATA, aldrig paa kode: intet fra en
# indsamlet kilde bliver fortolket eller udfoert.
#
# Arkiveringen pusher til grenen `research/fund` og ALDRIG til main.
# Publicering sker uaendret gennem godkendelseskaeden.
name: Research — ugentlig indsamling

on:
  schedule:
    - cron: '20 6 * * 1'   # mandag morgen, foer ugens godkendelse
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'publicering/research/**'
      - 'publicering/test/research.test.mjs'
      - '.github/workflows/research-ugentlig.yml'

permissions: {}          # intet som udgangspunkt. Hvert job beder om sit eget.

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # kan laese repoet. Kan intet aendre.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Proeverne foerst. Fejler de, hentes der ingenting.
      - name: Motorens proever
        run: node publicering/test/research.test.mjs

      - name: Indsaml
        run: node publicering/research/hent.mjs

      - name: Vurder mod sitet og skriv pakkeafsnit
        run: node publicering/research/vurder.mjs --skriv

      - name: Vagt — er fundfilerne velformede?
        run: node publicering/research/vagt-arkiv.mjs publicering/research/fund

      # Artefakten pakkes fra én fast mappe, ikke fra tre stier i repoet.
      #
      # upload-artifact regner den faelles rodmappe ud for de stier, den faar,
      # og lægger filerne relativt til DEN. Med fund/ og tilstand.json alene
      # var roden publicering/research, og arkiveringen fandt «fund/» og
      # «tilstand.json», som den regner med. Da udkastet kom til i PR #87,
      # flyttede den faelles rod ét niveau op til «publicering», og de samme
      # filer laa nu under «research/fund/» og «research/tilstand.json».
      # Arkiveringen leder stadig efter «indkommet/fund» — og vagten afviser
      # en mappe, der ikke findes, med kode 2. Mandagskoerslen ville braekke.
      #
      # En mappe, vi selv bygger, har samme form hver gang, uanset hvor
      # filerne ligger i repoet.
      - name: Stil filerne op til arkivering
        run: |
          set -euo pipefail
          mkdir -p tilarkiv/fund tilarkiv/udkast
          cp publicering/research/fund/*.json tilarkiv/fund/
          # tilstand.json er ETag-cache, ikke data. Den skrives af hent.mjs
          # ved enden af en lykket indsamling, saa den findes her — men et
          # job maa ikke doe over en cachefil.
          if [ -f publicering/research/tilstand.json ]; then
            cp publicering/research/tilstand.json tilarkiv/tilstand.json
          else
            echo "Ingen tilstand.json — ETag-cachen arkiveres ikke denne gang."
          fi
          # Tom uge giver intet udkast. Det er i orden og siges ligeud.
          if compgen -G 'publicering/udkast/research-*.md' > /dev/null; then
            cp publicering/udkast/research-*.md tilarkiv/udkast/
          else
            echo "Intet researchudkast denne uge."
          fi
          echo "── klar til arkivering ──"
          find tilarkiv -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: research-ugens-fund
          path: tilarkiv/
          retention-days: 90

  arkiver:
    needs: research
    # Kun paa den planlagte koersel og manuel start. En pull request skal
    # aldrig kunne faa noget arkiveret.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # det eneste job med skriveret. Roerer ikke nettet.
    steps:
      # Hentes fra standardgrenen og skiftes derefter til research/fund.
      # Findes grenen ikke endnu, oprettes den. En checkout af en gren, der
      # maaske ikke findes, ville ellers fejle foerste gang.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: research-ugens-fund
          path: indkommet

      # Vagten igen, paa det der faktisk skal skrives. Den foerste koersel
      # skete i et job uden skriveret; denne koerer lige foer committen.
      # Vagten koeres FOER grenskiftet, saa den kommer fra standardgrenen —
      # den gren, der er gennemgaaet og merget. Koertes den efter skiftet,
      # ville sikkerhedskontrollen stamme fra research/fund: den gren, dette
      # job selv skriver til. En vagt, automatikken kan naa at aendre, er
      # ingen vagt.
      - name: Vagt — kontroller det der skal arkiveres
        run: node publicering/research/vagt-arkiv.mjs indkommet/fund

      # Foerst nu skiftes der gren. Findes den ikke endnu, oprettes den.
      - name: Skift til research/fund
        run: |
          set -euo pipefail
          git fetch origin research/fund --depth=1 2>/dev/null \
            && git checkout -B research/fund origin/research/fund \
            || git checkout -B research/fund

      - name: Arkiver ugens fund
        run: |
          set -euo pipefail
          # Fundfilerne SKAL vaere der: naaede koerslen hertil, har vagten
          # netop godkendt dem. Et «|| true» her skjulte, at der ikke blev
          # arkiveret noget, og lod jobbet gaa groent.
          mkdir -p publicering/research/fund
          cp indkommet/fund/*.json publicering/research/fund/
          [ -f indkommet/tilstand.json ] && cp indkommet/tilstand.json publicering/research/ || echo "Ingen tilstand.json i artefakten." 
          # Udkastet kan mangle i en tom uge. Det er i orden og siges ligeud.
          mkdir -p publicering/udkast
          if compgen -G 'indkommet/udkast/research-*.md' > /dev/null; then
            cp indkommet/udkast/research-*.md publicering/udkast/
          else
            echo "Intet researchudkast i artefakten."
          fi
          rm -rf indkommet

          # Sidste spaerre: intet uden for research-mappen maa vaere aendret.
          git add -A
          AENDRET=$(git diff --cached --name-only)
          # Kun researchmappen og ugens researchudkast. Alt andet — laase,
          # koe, register, pakker, indhold — er uden for det, dette job maa
          # roere, uanset at rettigheden er repo-daekkende.
          UDENFOR=$(echo "$AENDRET" | grep -vE '^publicering/research/|^publicering/udkast/research-[0-9]{4}-[0-9]{2}\.md$' || true)
          if [ -n "$UDENFOR" ]; then
            echo "Diffen roerer noget uden for publicering/research/:"
            echo "$UDENFOR"
            exit 1
          fi
          if [ -z "$AENDRET" ]; then echo "Intet nyt at arkivere."; exit 0; fi

          git config user.email noreply@anthropic.com
          git config user.name "Research-motor"
          git commit -m "Research: ugens fund $(date -u +%G-%V)"
          git push origin HEAD:research/fund
