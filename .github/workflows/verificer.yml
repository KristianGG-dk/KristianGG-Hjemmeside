# Gate på hver PR. Læser, bygger og dømmer. Skriver intet.
name: Verificer godkendt indhold

on:
  pull_request:
    branches: [main]

permissions:
  contents: read        # kun læse. Kan ikke ændre det, den kontrollerer.

jobs:
  verificer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer Hugo 0.147.0 extended
        run: |
          curl -sSL -o hugo.tar.gz \
            https://github.com/gohugoio/hugo/releases/download/v0.147.0/hugo_extended_0.147.0_linux-amd64.tar.gz
          tar xzf hugo.tar.gz hugo && sudo mv hugo /usr/local/bin/
          hugo version

      # --buildFuture er den ene bevidste afvigelse fra produktionsbygget.
      # Gatens opgave er at kontrollere godkendt indhold, ogsaa indhold hvis
      # dato endnu ikke er naaet. Uden flaget er gaten roed paa hvert eneste
      # planlagte indlaeg. hugo.toml forbliver uroert: Netlify skal fortsat
      # udelade fremtidige indlaeg - det er dét, der goer planlaegningen mulig.
      - name: Byg som Netlify gør, men med fremtidige indlæg
        run: |
          npm install
          hugo --minify --buildFuture 2>&1 | tee byg.log
          if grep -qiE "^(ERROR|WARN)" byg.log; then
            echo "Build gav fejl eller advarsler"; exit 1
          fi

      - name: Versionslås og publiceringsfelter
        run: node publicering/scripts/verificer.mjs

      # Indholdskontrollen: titler, effektpaastande, priser, moms, forskning
      # uden kilde, genbrug, sporbarhed og kontrolstempel. FAIL og uafklaret
      # REVIEW stopper merge. Se publicering/regler/indholdsregler.json.
      - name: Indholdskontrol af alle kanaler
        run: |
          node publicering/test/kontroller-indhold.test.mjs
          node publicering/scripts/kontroller-indhold.mjs
