# Publicerer de LinkedIn-elementer, hvis godkendte tidspunkt er naaet.
#
# LinkedIn kan ikke planlaegge. "lifecycleState" accepterer kun PUBLISHED ved
# oprettelse, og der findes ingen scheduledAt. Skal et opslag ud kl. 08.00,
# skal nogen kalde API'et kl. 08.00. Det er denne koersel.
#
# Alle fem hidtidige LinkedIn-elementer er publiceret manuelt. Det var
# billigere end at bygge dette, saa laenge koeen var kort. Med en loebende
# publiceringsplan er det ikke laengere billigere.
#
# Delt i to jobs som de oevrige: publiceringen koerer uden skriveadgang til
# repoet, og kun registreringen bagefter maa skrive.
name: Publicer planlagte LinkedIn-elementer

on:
  schedule:
    # Hvert kvarter, paa skaeve minutter — samme begrundelse som Instagram.
    # '0,30 * * * *' er det mest brugte cron-udtryk paa GitHub Actions, og
    # planlagte koersler staar i koe, naar alle andres ogsaa goer. De syv
    # Instagram-opslag gik ud 45-212 minutter for sent paa det udtryk.
    #
    # Minutterne er forskudt fra Instagram (7,22,37,52) og Google (5,35), saa
    # de tre koersler ikke slaas om den samme runner.
    - cron: '11,26,41,56 * * * *'
  # GitHubs cron er «best effort» og intet andet. Maalt 27/10-01/11 koerte
  # dette workflow reelt hver 3.-6. time, ikke hvert kvarter (issue #90).
  # Med 60-minutters-graensen betyder det, at de fleste opslag vil blive
  # STOPPET i stedet for publiceret — graensen er ikke problemet, cron er.
  #
  # Derfor kan koerslen ogsaa startes udefra. En paalidelig planlaegger
  # (cron-job.org, en Netlify-funktion, en maskine der koerer) kalder:
  #
  #   POST https://api.github.com/repos/KristianGG-dk/KristianGG-Hjemmeside/dispatches
  #   Authorization: Bearer <fine-grained PAT, kun Actions: write>
  #   {"event_type": "publicer-linkedin"}
  #
  # Se dokumentation/paalidelig-udloeser.md. Indtil den findes, er cron den
  # eneste udloeser, og saa vil graensen standse opslag.
  repository_dispatch:
    types: [publicer-linkedin]
  workflow_dispatch:
    inputs:
      publicer:
        description: 'Sæt til true for at publicere. Ellers tørløb.'
        required: true
        type: boolean
        default: false

# To koersler maa aldrig vaere i gang samtidig. Registret skrives foerst i
# jobbet "registrer", saa en overlappende koersel ville laese et register uden
# den foerstes post og kunne publicere det samme element to gange.
concurrency:
  group: publicer-linkedin-planlagt
  cancel-in-progress: false

permissions: {}

jobs:
  # FOERSTE job. Skriver «PUBLICERING IGANG» i registret for de elementer,
  # der skal sendes, og committer det FOER noget sendes. Doer koerslen
  # derefter, staar kravet tilbage, og ingen senere koersel roerer elementet:
  # udfaldet er uvist, og uvist kraever et menneske. Se krav.mjs.
  #
  # Jobbet har skriveret, men ser ALDRIG nettet og faar intet token. Det job,
  # der taler med platformen, har stadig kun contents: read.
  krav:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      antal: ${{ steps.tag.outputs.antal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tag kravet paa forfaldne elementer
        id: tag
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer }}
        run: |
          set -euo pipefail
          node publicering/scripts/publicer-linkedin-planlagt.mjs --tag-krav
          echo "antal=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("krav-linkedin.json","utf8")).length)')" >> "$GITHUB_OUTPUT"

      - name: Commit kravet
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer }}
        run: |
          git config user.name "publiceringsmotor"
          git config user.email "kontakt@kristiangg.dk"
          bash publicering/scripts/commit-register.sh \
            publicering/register.json \
            "krav: linkedin" \
            "node publicering/scripts/publicer-linkedin-planlagt.mjs --tag-krav"

      - name: Gem kravet til publiceringsjobbet
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer }}
        uses: actions/upload-artifact@v4
        with:
          name: krav-linkedin
          path: krav-linkedin.json
          if-no-files-found: warn

  publicer:
    needs: krav
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Beskyt miljoeet i repo-indstillingerne: begraens "Deployment branches"
    # til main, saa workflow_dispatch fra en vilkaarlig branch ikke faar secrets.
    environment: publicering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Kravfilen afgoer, hvad der sendes. Udvaelgelsen ville nu springe netop
      # disse over, fordi de staar som «PUBLICERING IGANG» — det er meningen.
      - uses: actions/download-artifact@v4
        with:
          name: krav-linkedin
        continue-on-error: true

      - name: Publicer forfaldne LinkedIn-elementer
        shell: bash
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          LI_TILLADT_URN: ${{ secrets.LI_TILLADT_URN }}
          # Planlagt koersel publicerer for alvor. Manuel start er toerloeb,
          # medmindre der udtrykkeligt saettes flueben.
          PUBLICER: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer }}
        run: |
          ARGS=""; [ "$PUBLICER" = "true" ] && ARGS="--publicer"
          # Ingen pipe: scriptet skriver selv resultat-linkedin.json.
          # Et 'tee' ville overskrive den JSON med den menneskelaeselige log.
          node publicering/scripts/publicer-linkedin-planlagt.mjs $ARGS

      - name: Gem resultatet til registrering
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer) }}
        uses: actions/upload-artifact@v4
        with:
          name: resultat-linkedin
          path: resultat-linkedin.json
          if-no-files-found: warn

  registrer:
    needs: publicer
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publicer) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # eneste sted der skrives, og kun register.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: resultat-linkedin
        continue-on-error: true

      - name: Skriv i registret
        if: always()
        continue-on-error: true
        run: node publicering/scripts/publicer-linkedin-planlagt.mjs --skriv-register resultat-linkedin.json

      - name: Commit registret
        if: always()
        run: |
          git config user.name "publiceringsmotor"
          git config user.email "kontakt@kristiangg.dk"
          # Fem workflows skriver i samme register. Hjaelperen henter og
          # laegger vores raekker oven paa, hvis en anden koersel pushede
          # foerst — ellers gik posten tabt, og elementet ville blive
          # publiceret igen ved naeste planlagte koersel.
          bash publicering/scripts/commit-register.sh \
            publicering/register.json \
            "registrer: linkedin" \
            "node publicering/scripts/publicer-linkedin-planlagt.mjs --skriv-register resultat-linkedin.json"

      # Doemmer kun - skriver ikke. Ellers stod posterne i registret to gange.
      - name: Fejl jobbet hvis noget ikke blev publiceret
        run: node publicering/scripts/publicer-linkedin-planlagt.mjs --status-kun resultat-linkedin.json
