name: Vagthund

# Sammenholder koeen med registret og raaber op, naar noget ikke stemmer.
#
# Baggrund: element 2 og 9 passerede deres godkendte dato uden at nogen
# opdagede det, og det blev foerst fanget ti timer senere ved et tilfaelde.
# Naar opslag ligger hos Meta, Google og LinkedIn og gaar ud af sig selv,
# staar ingen laengere og kigger paa en knap, der bliver groen.
#
# Alarmkanalen er jobbets exit-kode: GitHub sender selv mail til ejeren, naar
# en planlagt koersel fejler. Ingen mailserver, ingen ny secret.
#
# Den koerer IKKE som PR-gate. En ny laasefil faar foerst en raekke i registret
# naar elementet er sendt, saa gaten ville fejle paa hver eneste ny-element-PR.

on:
  schedule:
    # To koersler. Klokkeslettene er valgt saa begge ligger EFTER dagens
    # publiceringsvinduer i baade sommer- og vintertid.
    - cron: '30 8 * * *'    # 10.30 sommertid / 09.30 vintertid — efter morgenopslagene (07, 08, 09)
    - cron: '30 18 * * *'   # 20.30 sommertid / 19.30 vintertid — efter aftenopslagene (19)
  workflow_dispatch:

permissions: {}

jobs:
  # Lukker forfaldne, aldrig publicerede opslag, saa vagthunden ikke melder
  # om dem i ugevis. Element 33 og 34 fik den samme alarm to gange dagligt i
  # sytten dage; den slags gør, at man holder op med at laese vagthunden.
  #
  # Det koerer FOERST, og vagthunden venter paa det. Koerte de parallelt,
  # ville vagthunden laese registret, foer lukningerne var landet, og melde
  # dem som fejl alligevel — netop den mail, oprydningen skal fjerne.
  #
  # Jobbet skriver kun i register.json og kun nye raekker. Det roerer ikke
  # laase, koe, pakker eller indhold, og det ser aldrig nettet.
  #
  # Det lukker ALDRIG noget, der er afsendt eller har et uvist udfald — se
  # afslut-forfaldne.mjs. Og det lukker intet inden for publiceringsvinduet.
  afslut:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # kun register.json, og kun nye raekker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Afslut forfaldne, aldrig publicerede opslag
        run: node publicering/scripts/afslut-forfaldne.mjs --skriv

      - name: Commit afslutningerne
        run: |
          git config user.name "publiceringsmotor"
          git config user.email "kontakt@kristiangg.dk"
          bash publicering/scripts/commit-register.sh \
            publicering/register.json \
            "afslut: forfaldne opslag" \
            "node publicering/scripts/afslut-forfaldne.mjs --skriv"

  vagthund:
    needs: afslut
    # always(), saa en fejlet oprydning ikke blinder vagthunden. Den skal
    # koere og melde, ogsaa naar noget andet er gaaet galt.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read      # laeser kun. Skriver intet, publicerer intet.
      actions: read       # for at se, OM de planlagte koersler stadig koerer
    steps:
      # ref: main, ikke koerslens egen SHA. Afslut-jobbet har netop committet
      # til main, og uden dette ville vagthunden laese registret fra FOER
      # lukningerne og melde dem som fejl.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Se koeen efter
        env:
          # Til koerselskontrollen: har de planlagte workflows koert for nylig?
          # Standser cron, falder et godkendt opslag igennem, og det skal
          # opdages FOER det sker.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node publicering/scripts/vagthund.mjs

