baseURL = "https://kristiangg.dk/"
languageCode = "da"
defaultContentLanguage = "da"
title = "Kristian GG"

[params]
  description = "Registreret psykoterapeut og naturterapeut i Odense. Psykoterapi, naturterapi og skovbad — i klinikken på Lumbyvej eller ude i naturen på Fyn."
  # Slået fra: fontene kan ikke selvhostes herfra, og previewet skal kunne
  # vurderes uden en Google Fonts-afhængighed. Reservestakken er Georgia til
  # overskrifter og system-ui til brødtekst.
  webfonts = true
  og_image = "/images/kristian-hero.png"

  # EasyMe Connect v3. Indlaeses kun paa begivenhedssider, hvis billetlink
  # peger paa ezme.io — ikke paa resten af sitet. Offentlig indlejrings-id,
  # ikke en hemmelighed. Tom vaerdi slaar integrationen fra, og billetlinket
  # virker da som et almindeligt link.
  easyme_connect_id = "easyme-connect-tCqYM74QJ6VW6jnlQfVr"

# ── Konverteringsmåling ──────────────────────────────────────────────────────
# FORBEREDT, IKKE AKTIVERET. Med aktiv = false indlæses INGEN måler: intet
# script, intet netværkskald, ingen cookie, intet samtykkekrav. Målepunkterne
# (data-konverter) og opsamlingen i assets/js/main.js ligger klar og venter
# kun på en modtager.
#
# Sådan aktiveres den — ét sted, to linjer:
#   aktiv   = true
#   udbyder = "plausible"   og   id = "kristiangg.dk"
#   eller
#   udbyder = "ga4"         og   id = "G-XXXXXXXXXX"
#
# Læs dokumentation/konverteringsmaaling.md først. Valget af udbyder afgør,
# om der skal indhentes samtykke, og det skal være afklaret FØR aktivering.
# samtykke_kraeves afgoer, om der skal foreligge et ja, FOER maaleren
# indlaeses, og foer en handling sendes. Plausible saetter ingen cookies
# og behandler ingen personoplysninger; GA4 goer begge dele og kraever
# samtykke. Vaelges GA4, skal denne saettes til true samtidig.
[params.konvertering]
  aktiv = false
  udbyder = ""
  id = ""
  samtykke_kraeves = false

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[sitemap]
  changefreq = "monthly"
  priority = 0.7
