title = "Kristian GG"

[params]
  description = "Registreret psykoterapeut og naturterapeut i Odense. Psykoterapi, naturterapi og skovbad — i klinikken på Lumbyvej eller ude i naturen på Fyn."
  # Slået fra: fontene kan ikke selvhostes herfra, og previewet skal kunne
  # vurderes uden en Google Fonts-afhængighed. Reservestakken er Georgia til
  # overskrifter og system-ui til brødtekst.
  webfonts = true
  og_image = "/images/kristian-hero.png"

  # EasyMe Connect v3. Indlaeses kun paa begivenhedssider, hvis billetlink
  # peger paa ezme.io — ikke paa resten af sitet. Offentlig indlejrings-id,
  # ikke en hemmelighed. Tom vaerdi slaar integrationen fra, og billetlinket
  # virker da som et almindeligt link.
  easyme_connect_id = "easyme-connect-tCqYM74QJ6VW6jnlQfVr"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[sitemap]
  changefreq = "monthly"
